version: '3.8'

services:
  autoplayer:
    build: .
    container_name: ${AUTOPLAYER_CONTAINER_NAME}
    ports:
      - "${AUTOPLAYER_PORT}:8000"
    environment:
      - CLICKHOUSE_HOST=${CLICKHOUSE_HOST}
      - CLICKHOUSE_PORT=${CLICKHOUSE_NATIVE_PORT} # Internal port 9000
      - CLICKHOUSE_DB=${CLICKHOUSE_DB}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
    networks:
      - conquer-network
    depends_on:
      - clickhouse

  clickhouse:
    image: clickhouse/clickhouse-server
    container_name: ${CLICKHOUSE_CONTAINER_NAME}
    environment:
      - CLICKHOUSE_DB=${CLICKHOUSE_DB}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
    ports:
      - "${CLICKHOUSE_HTTP_PORT}:8123"
      - "${CLICKHOUSE_NATIVE_PORT}:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse-config/users.xml:/etc/clickhouse-server/users.d/users.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - conquer-network

networks:
  conquer-network:
    external: true

volumes:
  clickhouse_data:
