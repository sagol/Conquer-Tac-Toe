version: '3.8'

services:
  admin-backend:
    build: ./backend
    container_name: ${ADMIN_BACKEND_CONTAINER_NAME}
    ports:
      - "${ADMIN_BACKEND_PORT}:${ADMIN_BACKEND_INTERNAL_PORT}"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      - CLICKHOUSE_HOST=${CLICKHOUSE_HOST}
      - CLICKHOUSE_PORT=${CLICKHOUSE_NATIVE_PORT}
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET}
      - ADMIN_JWT_REFRESH_SECRET=${ADMIN_JWT_REFRESH_SECRET}
      - ACCESS_TOKEN_EXPIRY=${ACCESS_TOKEN_EXPIRY}
      - REFRESH_TOKEN_EXPIRY=${REFRESH_TOKEN_EXPIRY}
      - PORT=${ADMIN_BACKEND_INTERNAL_PORT}
      - NODE_ENV=${NODE_ENV}
      - ADMIN_ALLOWED_ORIGINS=${ADMIN_ALLOWED_ORIGINS}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS}
      - LOG_LEVEL=${LOG_LEVEL}
      - ADMIN_DEFAULT_EMAIL=${ADMIN_DEFAULT_EMAIL}
      - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD}
      - ADMIN_DEFAULT_USERNAME=${ADMIN_DEFAULT_USERNAME}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL}
      - ADMIN_ALLOWED_EMAILS=${ADMIN_ALLOWED_EMAILS}
      - SESSION_SECRET=${SESSION_SECRET}
      - REACT_APP_ADMIN_API_URL=${REACT_APP_ADMIN_API_URL}
      - ADMIN_FRONTEND_URL=${ADMIN_FRONTEND_URL:-http://localhost:3002}
    networks:
      - conquer-network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Development volumes (uncomment for hot reload):
    #   - ./backend:/usr/src/app
    #   - /usr/src/app/node_modules

  admin-frontend:
    build: ./frontend
    container_name: ${ADMIN_FRONTEND_CONTAINER_NAME}
    ports:
      - "${ADMIN_FRONTEND_PORT}:${ADMIN_FRONTEND_INTERNAL_PORT}"
    environment:
      - REACT_APP_ADMIN_API_URL=${REACT_APP_ADMIN_API_URL}
      - REACT_APP_WEBSOCKET_URL=${REACT_APP_WEBSOCKET_URL}
    networks:
      - conquer-network
    depends_on:
      - admin-backend
    # volumes:
    #   - ./frontend:/app
    #   - /app/node_modules

  admin-tests:
    build: ./backend
    container_name: conquertactoe_admin_tests
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      - BACKEND_URL=http://conquertactoe_backend:3000
      - ADMIN_URL=http://admin-backend:4000
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET}
    networks:
      - conquer-network
    depends_on:
      - admin-backend
    command: [ "npm", "test", "--", "--runInBand" ]
    profiles:
      - test

networks:
  conquer-network:
    external: true
