version: '3.8'

services:
  admin-backend:
    build: ./backend
    container_name: ${ADMIN_BACKEND_CONTAINER_NAME}
    ports:
      - "${ADMIN_BACKEND_PORT}:${ADMIN_BACKEND_INTERNAL_PORT}"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      - CLICKHOUSE_HOST=${CLICKHOUSE_HOST}
      - CLICKHOUSE_PORT=${CLICKHOUSE_NATIVE_PORT}
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET}
      - ADMIN_JWT_REFRESH_SECRET=${ADMIN_JWT_REFRESH_SECRET}
      - ACCESS_TOKEN_EXPIRY=${ACCESS_TOKEN_EXPIRY}
      - REFRESH_TOKEN_EXPIRY=${REFRESH_TOKEN_EXPIRY}
      - PORT=${ADMIN_BACKEND_INTERNAL_PORT}
      - NODE_ENV=${NODE_ENV}
      - ALLOWED_ORIGINS=${ADMIN_ALLOWED_ORIGINS}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS}
      - LOG_LEVEL=${LOG_LEVEL}
    networks:
      - ${NETWORK_NAME}
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules

  admin-frontend:
    build: ./frontend
    container_name: ${ADMIN_FRONTEND_CONTAINER_NAME}
    ports:
      - "${ADMIN_FRONTEND_PORT}:${ADMIN_FRONTEND_INTERNAL_PORT}"
    environment:
      - REACT_APP_ADMIN_API_URL=${REACT_APP_ADMIN_API_URL}
      - REACT_APP_WEBSOCKET_URL=${REACT_APP_WEBSOCKET_URL}
    networks:
      - ${NETWORK_NAME}
    depends_on:
      - admin-backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

networks:
  ${NETWORK_NAME}:
    external: true
