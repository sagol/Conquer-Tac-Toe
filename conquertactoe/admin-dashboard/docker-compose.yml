services:
  admin-backend:
    build: ./backend
    container_name: conquertactoe_admin_backend
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/conquertactoe
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=9000
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET:-your-super-secret-admin-key-change-in-production}
      - ADMIN_JWT_REFRESH_SECRET=${ADMIN_JWT_REFRESH_SECRET:-your-super-secret-refresh-key}
      - ACCESS_TOKEN_EXPIRY=1h
      - REFRESH_TOKEN_EXPIRY=7d
      - PORT=4000
      - NODE_ENV=${NODE_ENV:-development}
      - ALLOWED_ORIGINS=http://localhost:3002
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=100
      - LOG_LEVEL=info
    networks:
      - conquer-network
    depends_on:
      - postgres
      - clickhouse
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  admin-frontend:
    build: ./frontend
    container_name: conquertactoe_admin_frontend
    ports:
      - "3002:3000"
    environment:
      - REACT_APP_ADMIN_API_URL=http://localhost:4000/admin
      - REACT_APP_WEBSOCKET_URL=ws://localhost:4000
    networks:
      - conquer-network
    volumes:
      - ./frontend:/app
      - /app/node_modules
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

    depends_on:
      - admin-backend

networks:
  conquer-network:
    external: true
